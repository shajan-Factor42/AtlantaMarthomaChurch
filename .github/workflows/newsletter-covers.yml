# Creates the front-page image shown for each newsletter on the website.
# Runs automatically when a newsletter is added; can also be run by hand from the Actions tab.
name: Newsletter covers

on:
  push:
    paths:
      - "_data/newsletters.yml"
      - "assets/newsletters/**.pdf"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: python3 scripts/newsletter-covers.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add assets/newsletters/covers _data/newsletters.yml
          git diff --cached --quiet && echo "No new covers" || (git commit -m "Add newsletter covers" && git push)
