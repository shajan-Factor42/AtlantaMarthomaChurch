{% assign p = page.url %}
<header class="site-header" id="top">
  <div class="topbar">
    <div class="wrap topbar__inner">
      <span>Sunday Worship · <span data-sunday-services>{{ site.data.church.worship.times }}</span></span>
      <span class="topbar__links">
        <a href="{{ site.data.church.livestream_url }}" target="_blank" rel="noopener"><span class="live-dot"></span> Watch Live</a>
        <a href="mailto:{{ site.data.church.email }}">{{ site.data.church.email }}</a>
      </span>
    </div>
  </div>
  <div class="wrap nav">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ site.media_base }}/2026/03/Logo-MTCA-1.png" alt="{{ site.title }}" class="brand__logo">
    </a>
    <button class="nav__toggle" aria-expanded="false" aria-controls="nav-menu">
      <span></span><span></span><span></span><span class="sr">Menu</span>
    </button>
    <nav id="nav-menu" class="nav__menu" aria-label="Main">
      <a href="{{ '/' | relative_url }}" {% if p == '/' %}aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/about/' | relative_url }}" {% if p contains '/about' %}aria-current="page"{% endif %}>About</a>
      <a href="{{ '/worship/' | relative_url }}" {% if p contains '/worship' %}aria-current="page"{% endif %}>Worship</a>
      <a href="{{ '/events/' | relative_url }}" {% if p contains '/events' %}aria-current="page"{% endif %}>Events</a>
      <a href="{{ '/organizations/' | relative_url }}" {% if p contains '/organizations' %}aria-current="page"{% endif %}>Organizations</a>
      <a href="{{ '/gallery/' | relative_url }}" {% if p contains '/gallery' %}aria-current="page"{% endif %}>Gallery</a>
      <a href="{{ '/newsletters/' | relative_url }}" {% if p contains '/newsletters' %}aria-current="page"{% endif %}>Newsletters</a>
      <a href="{{ '/contact-us/' | relative_url }}" {% if p contains '/contact' %}aria-current="page"{% endif %}>Contact</a>
      <a href="{{ '/prayer-request/' | relative_url }}" {% if p contains '/prayer-request' %}aria-current="page"{% endif %}>Prayer Request</a>
      <span class="nav__actions">
        <a class="btn btn--small btn--gold nav__donate" href="{{ '/give/' | relative_url }}" {% if p contains '/give' %}aria-current="page"{% endif %}>Donate</a>
        <a class="btn btn--small btn--outline nav__login" href="{{ '/members/' | relative_url }}">Member Login</a>
      </span>
    </nav>
  </div>
</header>
